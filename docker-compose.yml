services:
  postgres:
    image: postgres:18
    environment:
      - POSTGRES_USER=akb
      - POSTGRES_PASSWORD=akb
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - app
    restart: always
  
  akb-django-app:
    build: .
    env_file:
      - secret.env # SECRET_KEY
    environment:
      - ALLOWED_HOSTS=*
      - PRODUCTION=1
      - DATABASE_URL=postgres://akb:akb@postgres/akb
      - VIRTUAL_HOST=akb.ztf.snad.space
      - DYNDNS_HOST=akb.ztf.snad.space
      - LETSENCRYPT_HOST=akb.ztf.snad.space
      - LETSENCRYPT_EMAIL=letsencrypt@snad.space
    depends_on:
      - postgres
    networks:
      - app
      - proxy
    restart: always

  akb-django-backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    depends_on:
      - akb-django-app
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - secret.env # RCLONE_CONFIG
    restart: on-failure

volumes:
  postgres-data:

networks:
  app:
  proxy:
    external: true
    name: proxy
